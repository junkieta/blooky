<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime Visual Demo</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 24px; background: #0b1020; color: #e6edf3; }
      h1 { margin: 0 0 8px; }
      p { color: #9fb0c3; }
      .row { display:flex; gap:8px; flex-wrap: wrap; margin: 16px 0; }
      button { border:1px solid #2f3a55; background:#16213a; color:#e6edf3; padding:8px 12px; border-radius:8px; cursor:pointer; }
      button:hover { background:#1e2c4b; }
      .panel { border:1px solid #28334f; background:#111a2f; border-radius: 12px; padding: 12px; margin-top: 12px; }
      .stats { display:flex; gap:16px; flex-wrap:wrap; font-size: 13px; color:#9fb0c3; }
      .log { max-height: 52vh; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .line { padding:6px 8px; border-bottom:1px solid #1f2a44; }
      .tag { display:inline-block; min-width:74px; padding:2px 6px; border-radius:999px; text-align:center; margin-right:8px; }
      .enter{ background:#274472; } .effect{ background:#6b4a1f; } .suspend{ background:#5a2d6f; }
      .resume{ background:#285e61; } .result{ background:#0f5e46; } .terminate{ background:#8a2b2b; }
      .exit{ background:#1f6f43; } .cancel{ background:#5f3a1f; }
      .warn{ color:#ffb86b; }
      code { background:#18233d; padding:2px 6px; border-radius:6px; }
    </style>
  </head>
  <body>
    <h1>Runtime Visual Demo</h1>
    <p>現行 runtime の仕様意図（<code>race_loser</code> cancel / <code>terminate→exit</code> 閉包 / result 後の違反検出）を、Step タイムラインとして可視化します。</p>

    <div class="row">
      <button id="runRace">Run race scenario</button>
      <button id="runTerminate">Run terminate closure</button>
      <button id="runViolation">Run result-after-event violation</button>
      <button id="clear">Clear</button>
    </div>

    <div class="panel stats" id="stats"></div>
    <div class="panel log" id="log"></div>

    <script>
      const PHASES = ["enter","effect","suspend","resume","result","terminate","exit","cancel"];
      const logEl = document.getElementById("log");
      const statsEl = document.getElementById("stats");
      const steps = [];
      let seq = 0;

      function renderStats() {
        const by = Object.fromEntries(PHASES.map(p => [p,0]));
        for (const s of steps) by[s.phase] = (by[s.phase] || 0) + 1;
        statsEl.innerHTML = [
          `<span>steps: <b>${steps.length}</b></span>`,
          ...PHASES.map(p => `<span>${p}: <b>${by[p]}</b></span>`)
        ].join(" ");
      }

      function push(step) {
        const item = { seq: ++seq, ...step };
        steps.push(item);
        const line = document.createElement("div");
        line.className = "line";
        line.innerHTML = `<span class="tag ${item.phase}">${item.phase}</span><b>#${item.seq}</b> <code>${item.execution_id}</code> ${item.msg ?? ""}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
        renderStats();
      }

      async function runRaceScenario() {
        push({ phase:"enter", execution_id:"root:race", msg:"race start" });
        const kids = ["a","b","c"].map(id => ({ id, cancelled:false }));
        let settled = false;

        const jobs = kids.map((k, i) => new Promise((resolve) => {
          const delay = 180 + i * 120;
          push({ phase:"enter", execution_id:`root:race:${k.id}`, msg:`spawn delay=${delay}ms` });
          setTimeout(() => {
            if (k.cancelled) {
              push({ phase:"cancel", execution_id:`root:race:${k.id}`, msg:'reason=race_loser' });
              resolve({ loser:true, i });
              return;
            }
            push({ phase:"result", execution_id:`root:race:${k.id}`, msg:"branch result" });
            push({ phase:"exit", execution_id:`root:race:${k.id}`, msg:"branch exit" });
            resolve({ loser:false, i, value:k.id });
          }, delay);
        }));

        const winner = await Promise.race(jobs);
        if (!settled) {
          settled = true;
          kids.forEach((k, i) => { if (i !== winner.i) k.cancelled = true; });
        }

        push({ phase:"result", execution_id:"root:race", msg:`winner=${winner.value ?? 'unknown'}` });
        push({ phase:"exit", execution_id:"root:race", msg:"race exit" });
      }

      function runTerminateScenario() {
        push({ phase:"enter", execution_id:"root:sequence", msg:"begin" });
        push({ phase:"effect", execution_id:"root:sequence:call", msg:"dispatch effect" });
        push({ phase:"terminate", execution_id:"root:sequence", msg:"terminated(value=ok)" });
        push({ phase:"exit", execution_id:"root:sequence", msg:"MUST close terminate with exit" });
      }

      function runViolationScenario() {
        push({ phase:"enter", execution_id:"root:call", msg:"begin" });
        push({ phase:"effect", execution_id:"root:call", msg:"applyEffect -> result" });
        push({ phase:"result", execution_id:"root:call", msg:"result synthesized" });
        const line = document.createElement("div");
        line.className = "line warn";
        line.textContent = "FSM violation example: event after result would be detected (not silently dropped).";
        logEl.appendChild(line);
        push({ phase:"exit", execution_id:"root:call", msg:"exit" });
      }

      document.getElementById("runRace").onclick = runRaceScenario;
      document.getElementById("runTerminate").onclick = runTerminateScenario;
      document.getElementById("runViolation").onclick = runViolationScenario;
      document.getElementById("clear").onclick = () => { steps.length = 0; seq = 0; logEl.innerHTML = ""; renderStats(); };

      renderStats();
    </script>
  </body>
</html>

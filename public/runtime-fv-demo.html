<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime score-fx Demo</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 24px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f8fc;
        color: #121826;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      button {
        border: 1px solid #98a2b3;
        background: #ffffff;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      select,
      input[type="number"] {
        border: 1px solid #98a2b3;
        background: #ffffff;
        border-radius: 8px;
        padding: 8px 10px;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .panel {
        border: 1px solid #d0d5dd;
        background: #ffffff;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .small {
        font-size: 13px;
        color: #344054;
      }
      #mount {
        margin-bottom: 12px;
      }
      #log {
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
      }
      #summary {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>Runtime score-fx Demo (No Devtools)</h1>
    <p class="small">sequence / parallel / race / condition / switch / loop / yield / return を1本のflowで実行し、step timelineを表示します。</p>
    <div id="mount"></div>
    <div class="panel row">
      <button id="run">Run scenario</button>
      <button id="cancel" disabled>Cancel</button>
      <button id="resolve" disabled>Yield resolve(approve)</button>
      <button id="reject" disabled>Yield reject(error)</button>
    </div>
    <div class="panel row">
      <label>mode
        <select id="mode">
          <option value="safe">safe</option>
          <option value="fast" selected>fast</option>
          <option value="other">other(default)</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="feature" checked />
        condition=true
      </label>
      <label>loop iterations
        <input id="loopLimit" type="number" min="1" max="8" value="3" />
      </label>
    </div>
    <div class="panel small" id="status">idle</div>
    <div class="panel small" id="pending">pending yield: none</div>
    <div class="panel small" id="summary"></div>
    <div class="panel">
      <div class="small">step timeline</div>
      <pre id="log"></pre>
    </div>
    <template id="confirm-template"></template>
    <script type="module" src="/src/demo-runtime-fv.ts"></script>
  </body>
</html>

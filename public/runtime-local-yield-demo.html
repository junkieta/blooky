<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime Local Yield Demo</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 24px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f8fc;
        color: #121826;
      }
      h1 {
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      button {
        border: 1px solid #98a2b3;
        background: #ffffff;
        color: #121826;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .panel {
        border: 1px solid #d0d5dd;
        background: #ffffff;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .small {
        font-size: 13px;
        color: #344054;
      }
      .steps {
        max-height: 280px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Runtime Local Yield Demo</h1>
    <p class="small">flow: <code>yield(local template) -> return(#confirm)</code></p>

    <div class="row">
      <button id="run">Run</button>
      <button id="resolve" disabled>Resolve</button>
      <button id="reject" disabled>Reject</button>
    </div>

    <div class="panel small" id="status">idle</div>
    <div class="panel small" id="pending">pending: none</div>
    <div class="panel small">yield input: <span id="question">-</span></div>
    <div class="panel small">execution: <span id="execution">-</span></div>
    <div class="panel"><pre id="output"></pre></div>
    <div class="panel steps" id="steps"></div>

    <template id="confirm-template"></template>
    <script type="module" src="/src/demo-runtime-local.ts"></script>
  </body>
</html>
